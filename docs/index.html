<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>maac</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      /* ブラウザの表示領域いっぱいにゲーム画面を広げる */
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #ffffff;
        outline: none;
      }
      #unity-loading {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(40vw, 480px);
        font-family: sans-serif;
        font-weight: bold;
        color: #000000;
        text-align: center;
      }
      #unity-loading-bar {
        margin-top: 12px;
        height: 14px;
        border: 3px solid #000000;
        background: #ffffff;
      }
      #unity-loading-fill {
        width: 0%;
        height: 100%;
        background: #222222;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        display: none;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        NOW LOADING...
        <div id="unity-loading-bar"><div id="unity-loading-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; color: white; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/docs.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/docs.data.unityweb",
        frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
        codeUrl: buildUrl + "/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "maac",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        var loading = document.querySelector("#unity-loading");
        var fill = document.querySelector("#unity-loading-fill");
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          // ページを開いた直後からキーボード入力が効くようにフォーカスを当てる
          canvas.focus();
          window.addEventListener("pointerdown", function () { canvas.focus(); });
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
